<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Impact Gate reads API contract changes, traces downstream callers, and surfaces evidence for review."
    />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0D1E38" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Libre+Caslon+Text:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("impact-gate-theme") ?? "system";
        } catch {
          theme = "system";
        }
        const isDark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
      })();
    </script>
    <title>Know who breaks before you merge. | Impact Gate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
