    <script>
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("impact-gate-theme") ?? "system";
        } catch {
          theme = "system";
        }
        const isDark =
          theme === "dark" ||
          (theme === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = isDark ? "dark" : "light";
      })();
    </script>
